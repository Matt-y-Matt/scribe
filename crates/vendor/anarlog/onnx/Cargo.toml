[package]
name = "onnx"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["ort/cuda"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]

[dependencies]
ndarray = "0.16"
# Scribe: ort's defaults minus `copy-dylibs` (see ../VENDORED.md).
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries"] }
thiserror = "2"
tracing = "0.1"

# Scribe: upstream warnings are upstream's to fix (see ../VENDORED.md).
[lints.rust]
warnings = "allow"
