[package]
name = "audio-device"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
specta = { version = "2.0.0-rc.22", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery"] }
windows-core = "0.62.2"

# Scribe: upstream warnings are upstream's to fix (see ../VENDORED.md).
[lints.rust]
warnings = "allow"
