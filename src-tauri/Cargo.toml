[package]
name = "scribe"
version = "0.1.0"
description = "Scribe, a meeting secretary that sits in the room"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# matters on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "scribe_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
# Added in M0 per docs/BUILD_PLAN.md; registered in M3 (hold-to-talk).
tauri-plugin-global-shortcut = "2"

# Capture, echo cancellation and VAD: Anarlog's crates, vendored by commit
# (crates/vendor/anarlog/VENDORED.md). Do not rewrite capture.
audio-actual = { path = "../crates/vendor/anarlog/audio-actual" }
anlg-audio = { path = "../crates/vendor/anarlog/audio", package = "audio" }
vad = { path = "../crates/vendor/anarlog/vad", features = ["silero-onnx"] }
# Playback of the recording: rodio, and the vendored helper that opens the
# output device.
anlg-audio-utils = { path = "../crates/vendor/anarlog/audio-utils", package = "audio-utils" }
rodio = { version = "0.22", default-features = false, features = ["playback"] }
# Speech to text: the official sherpa-onnx bindings (DECISIONS 2026-11-19).
sherpa-onnx = "2.0.1"
hound = "3.5"
ndarray = "0.16"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
sha2 = "0.10"
tokio-util = "0.7"
# The store: sqlx directly, with SQLite and FTS5 built in (DECISIONS 2026-11-19).
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
ulid = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net"] }
futures-util = "0.3"

# Typed Rust <-> TS boundary (src/ipc.rs -> ../src/ipc.ts)
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "=0.0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
