name: CI

# The M0 gate (docs/BUILD_PLAN.md): `pnpm check && pnpm test` green on Windows.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Two build scripts download native libraries: sherpa-onnx-sys into
      # target/sherpa-onnx-prebuilt and ort-sys into the user's cache folder.
      # The cache above keeps the record that they ran but not what they
      # fetched, so a restored build links against files that are not there.
      # Forgetting the record makes both scripts run again.
      - name: Have the native-library build scripts run again
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'sherpa-onnx-sys*' -or $_.Name -like 'ort-sys*' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: pnpm test
        shell: pwsh
        run: |
          pnpm test 2>&1 | Tee-Object -FilePath test-output.txt
          exit $LASTEXITCODE

      # The job log can only be read by the repository's admins. Annotations
      # can be read by anyone who can see the run, so the lines that say what
      # failed are repeated there.
      - name: Say what failed
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path test-output.txt) {
            Select-String -Path test-output.txt -CaseSensitive -Pattern 'FAILED|panicked|^error|AssertionError|LNK\d+|left:|right:|×' |
              Select-Object -First 9 |
              ForEach-Object { "::error::$($_.Line.Trim())" }
          }

      # UI behaviour (docs/TEST_PLAN.md §1): Playwright against `vite dev`.
      - run: pnpm exec playwright install chromium

      - run: pnpm e2e

      - name: Keep the Playwright report when a UI test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The manifest is embedded by the linker (src-tauri/build.rs). A binary
      # without it exits at load, so prove the real app executable stays up.
      - name: Smoke test, the app starts
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml
          $app = Start-Process -FilePath src-tauri/target/debug/scribe.exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "scribe.exe exited within 8 s, code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
